check-for-app-update: false
only-fixed: false
ignore: []
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "**/.wrangler/**"
  - "**/.git/**"
fail-on-severity: high

db:
  auto-update: true
  validate-by-hash-on-start: true
  validate-age: true
  max-allowed-built-age: 120h
  require-update-check: true
  update-available-timeout: 30s
  update-download-timeout: 3m
