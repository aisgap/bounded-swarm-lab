name: Bug report
description: Report reproducible, non-sensitive incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bounded Swarm Lab is an experimental private-pilot project. Never include API keys, work-confidential text, provider response bodies, database exports, or active deployment identifiers.

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Handoff Simulation
        - Live experiment
        - Setup, build, or deployment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Use synthetic or redacted examples only.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the issue.
      placeholder: |
        1. Start in Handoff Simulation
        2. Select the SOP preset
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Commit SHA or release tag only. Do not include a deployment ID.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and Node.js version, with no account details.

  - type: textarea
    id: safe_evidence
    attributes:
      label: Non-sensitive evidence
      description: Include safe error codes or redacted screenshots. Never include secrets, task text, or provider bodies.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, confidential task content, provider bodies, database exports, and active deployment identifiers.
          required: true
        - label: If a provider outcome was unknown, I did not repeat that request.
          required: true
